<title>หน้าเบิกยาเจ้าหน้าที่</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: คิวใบเบิก (แถบสถานะ 4 ขั้นกดกรอง → แถวละใบ) ↔ หน้ารายละเอียดใบ (หัวใบ+ขั้น → ตัวกรองในใบ → ตาราง ≥768px / การ์ด <768px → แถบปุ่มล่างจอ) */
:root {
  --bg: #f1f5f9; --surface: #ffffff; --sunken: #f8fafc; --fg: #1e293b; --muted: #64748b; --faint: #94a3b8; --line: #e2e8f0;
  --accent: #1E90FF; --accent-ink: #ffffff; --accent-soft: #e8f3ff;
  --red: #b91c1c; --red-soft: #fee2e2; --red-line: #fca5a5; --red-tint: #fef2f2;
  --amber: #92400e; --amber-soft: #fef3c7; --amber-line: #fcd34d; --amber-tint: #fffbeb;
  --green: #047857; --green-soft: #d1fae5; --green-line: #6ee7b7;
  --violet: #6d28d9; --violet-soft: #ede9fe; --violet-line: #c4b5fd;
  --teal: #0f766e; --teal-soft: #ccfbf1; --teal-line: #5eead4;
  --indigo: #4338ca; --indigo-soft: #eef2ff; --indigo-line: #c7d2fe;
  --slate-soft: #e2e8f0; --slate-line: #cbd5e1;
  --shadow: 0 -6px 20px rgba(15, 23, 42, .08);
  --font: "Noto Sans Thai", "Leelawadee UI", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1220; --surface: #0f172a; --sunken: #111c2f; --fg: #e2e8f0; --muted: #94a3b8; --faint: #64748b; --line: #1e293b;
  --accent: #60a5fa; --accent-ink: #0b1220; --accent-soft: #10264a;
  --red: #fca5a5; --red-soft: #3b1217; --red-line: #7f1d1d; --red-tint: #1f0d12;
  --amber: #fcd34d; --amber-soft: #33240a; --amber-line: #78350f; --amber-tint: #1d1609;
  --green: #6ee7b7; --green-soft: #062a20; --green-line: #065f46;
  --violet: #c4b5fd; --violet-soft: #1f1640; --violet-line: #4c1d95;
  --teal: #5eead4; --teal-soft: #062b28; --teal-line: #115e59;
  --indigo: #a5b4fc; --indigo-soft: #161a3d; --indigo-line: #3730a3;
  --slate-soft: #1e293b; --slate-line: #334155;
  --shadow: 0 -6px 20px rgba(0, 0, 0, .45); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #0f172a; --sunken: #111c2f; --fg: #e2e8f0; --muted: #94a3b8; --faint: #64748b; --line: #1e293b;
  --accent: #60a5fa; --accent-ink: #0b1220; --accent-soft: #10264a;
  --red: #fca5a5; --red-soft: #3b1217; --red-line: #7f1d1d; --red-tint: #1f0d12;
  --amber: #fcd34d; --amber-soft: #33240a; --amber-line: #78350f; --amber-tint: #1d1609;
  --green: #6ee7b7; --green-soft: #062a20; --green-line: #065f46;
  --violet: #c4b5fd; --violet-soft: #1f1640; --violet-line: #4c1d95;
  --teal: #5eead4; --teal-soft: #062b28; --teal-line: #115e59;
  --indigo: #a5b4fc; --indigo-soft: #161a3d; --indigo-line: #3730a3;
  --slate-soft: #1e293b; --slate-line: #334155;
  --shadow: 0 -6px 20px rgba(0, 0, 0, .45); color-scheme: dark }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 16px 140px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; }
.view { display: grid; gap: 12px; min-width: 0; }
.wrap > *, .view > *, .slipHead > * { min-width: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12.5px; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 1em; height: 1em; flex: none; vertical-align: -0.15em; }

.note { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.note b { color: var(--fg); font-weight: 600; }
.appbar { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.appbar h1 { font-size: 18px; margin: 0; font-weight: 700; text-wrap: balance; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--slate-line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--sunken); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
.btn.danger { color: var(--red); border-color: var(--red-line); }
.btn.danger:hover { background: var(--red-tint); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); font-weight: 500; }
.btn.ghost:hover { background: var(--sunken); color: var(--fg); }

.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.chip { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 10px 8px 12px; cursor: pointer; display: grid; gap: 2px; min-width: 0; position: relative; overflow: clip; }
.chip::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--c, var(--slate-line)); }
.chip .k { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip .v { font-size: 22px; font-weight: 700; color: var(--c, var(--fg)); line-height: 1.2; }
.chip .s { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.c-sheet { --c: var(--amber); } .c-pick { --c: var(--accent); } .c-check { --c: var(--violet); } .c-hist { --c: var(--muted); }

.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 220px; min-width: 0; border: 1px solid var(--slate-line); background: var(--surface); border-radius: 10px; padding: 7px 10px; }
.sel { border: 1px solid var(--slate-line); background: var(--surface); border-radius: 10px; padding: 7px 8px; }
.seg { display: inline-flex; border: 1px solid var(--slate-line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--slate-line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.count { font-size: 12.5px; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border: 1px solid; border-radius: 999px; padding: 0 8px; white-space: nowrap; line-height: 1.6; }
.p-red { color: var(--red); background: var(--red-soft); border-color: var(--red-line); }
.p-amber { color: var(--amber); background: var(--amber-soft); border-color: var(--amber-line); }
.p-green { color: var(--green); background: var(--green-soft); border-color: var(--green-line); }
.p-violet { color: var(--violet); background: var(--violet-soft); border-color: var(--violet-line); }
.p-blue { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
.p-teal { color: var(--teal); background: var(--teal-soft); border-color: var(--teal-line); }
.p-slate { color: var(--muted); background: var(--slate-soft); border-color: var(--slate-line); }
.p-indigo { color: var(--indigo); background: var(--indigo-soft); border-color: var(--indigo-line); }

/* คิว */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: clip; }
.qhead, .qrow { display: grid; grid-template-columns: 6px minmax(0, 2.1fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.5fr) 20px; gap: 12px; align-items: center; }
.qhead { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; padding: 8px 12px 8px 0; font-size: 12px; color: var(--muted); background: var(--sunken); border-bottom: 1px solid var(--line); font-weight: 600; }
.qrow { padding: 10px 12px 10px 0; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); width: 100%; text-align: left; }
button.qrow { cursor: pointer; }
button.qrow:hover { background: var(--sunken); }
div.qrow { color: var(--muted); }
.stripe { align-self: stretch; border-radius: 0 3px 3px 0; background: var(--c, var(--slate-line)); }
.nm { min-width: 0; display: grid; gap: 1px; }
.nm .t { font-weight: 600; font-size: 15px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nm .m { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.cell { min-width: 0; display: grid; gap: 2px; }
.cell .a { font-weight: 600; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell .b { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; }
.lbl { display: none; font-size: 11px; color: var(--faint); }
.chev { color: var(--faint); justify-self: end; }
.empty { padding: 28px 12px; text-align: center; color: var(--muted); }

/* หน้ารายละเอียด */
.back { justify-self: start; }
.slipHead { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 12px; }
.sh-top { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: flex-start; }
.sh-top h1 { margin: 0; font-size: 20px; font-weight: 700; }
.sh-meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.sh-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.sh-badges .pill { font-size: 12.5px; padding: 2px 10px; }
.sh-actions { display: flex; flex-wrap: wrap; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 6px; }
.steps li { display: grid; gap: 2px; padding-top: 10px; border-top: 3px solid var(--line); font-size: 12.5px; color: var(--muted); min-width: 0; }
.steps li b { font-weight: 600; font-size: 13px; color: inherit; }
.steps li span { font-size: 11.5px; }
.steps li.done { border-top-color: var(--green); color: var(--fg); }

.steps li.now { border-top-color: var(--accent); color: var(--accent); }
.demo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); border: 1px dashed var(--slate-line); border-radius: 12px; padding: 8px 10px; }
.callout { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; border: 1px solid; border-radius: 12px; padding: 9px 12px; }
.callout.k-sheet { color: var(--amber); background: var(--amber-tint); border-color: var(--amber-line); }
.callout.k-pick { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
.callout.k-check { color: var(--violet); background: var(--violet-soft); border-color: var(--violet-line); }
.callout.k-done { color: var(--teal); background: var(--teal-soft); border-color: var(--teal-line); }
.callout svg { margin-top: 2px; }
.fchips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 12px; cursor: pointer; font-size: 13px; color: var(--muted); }
.fchip b { color: var(--fg); font-weight: 700; }
.fchip.f-near b { color: var(--amber); } .fchip.f-short b, .fchip.f-part b { color: var(--red); } .fchip.f-over b { color: var(--violet); }
.fchip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* ตารางรายการ (≥768px) */
.tbl { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: clip; }
table.it { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
.it col.c-idx { width: 40px; } .it col.c-drug { width: 27%; } .it col.c-req { width: 12%; } .it col.c-loc { width: 11%; } .it col.c-res { width: 21%; }
.it th { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--sunken); color: var(--muted); font-size: 12px; font-weight: 600; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.it th small { font-weight: 500; color: var(--faint); }
.it th.r, .it td.r { text-align: right; }
.it td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 0; }
.it td.idx { color: var(--faint); text-align: right; padding-right: 4px; }
.it tr.flag td { background: var(--amber-tint); }
.it tr.flag td:first-child { box-shadow: inset 3px 0 0 var(--amber); }
.it tr.bad td { background: var(--red-tint); }
.it tr.bad td:first-child { box-shadow: inset 3px 0 0 var(--red); }
.it tr.grp td { background: var(--indigo-soft); color: var(--indigo); font-weight: 600; font-size: 12.5px; padding: 6px 10px; }
.dn { font-weight: 600; overflow-wrap: anywhere; }
.dm { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; margin-top: 2px; }
.rq { font-weight: 700; font-size: 15px; }
.rq small, .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.locs { display: grid; gap: 4px; justify-items: start; }
.locp { font-family: var(--mono); font-size: 12px; color: var(--indigo); background: var(--indigo-soft); border: 1px solid var(--indigo-line); border-radius: 6px; padding: 0 6px; overflow-wrap: anywhere; }
.lotl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding-block: 4px; }
.lotl + .lotl { border-top: 1px dashed var(--line); }
.ll-a { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; min-width: 0; }
.ll-a .exp { color: var(--muted); font-size: 12.5px; }
.ll-q { text-align: right; white-space: nowrap; }
.ll-q b { font-weight: 700; color: var(--green); }
.ll-q small { display: block; font-size: 11.5px; color: var(--muted); }
.it .ll-q small { display: inline; margin-right: 8px; }
.it .lotl { align-items: baseline; }
.lnote { font-size: 12px; font-weight: 600; display: flex; gap: 4px; align-items: center; margin-top: 4px; }
.lnote.warn { color: var(--violet); } .lnote.bad { color: var(--red); }
.okt { color: var(--green); font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.est { color: var(--muted); }
.rseg { display: inline-flex; border: 1px solid var(--slate-line); border-radius: 9px; overflow: hidden; }
.rseg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
.rseg button + button { border-left: 1px solid var(--slate-line); }
.rseg button[aria-pressed="true"].full { background: var(--green); color: var(--surface); }
.rseg button[aria-pressed="true"].part { background: var(--red); color: var(--surface); }
.partf { display: grid; gap: 6px; margin-top: 8px; }
.partf label { display: flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.partf input { width: 6.5em; border: 1px solid var(--slate-line); background: var(--surface); border-radius: 8px; padding: 4px 8px; text-align: right; }
.partf select { border: 1px solid var(--slate-line); background: var(--surface); border-radius: 8px; padding: 4px 6px; max-width: 100%; }

/* การ์ดรายการ (<768px) */
.cards { display: grid; gap: 8px; }
.icard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.icard.flag { border-color: var(--amber-line); box-shadow: inset 3px 0 0 var(--amber); }
.icard.bad { border-color: var(--red-line); box-shadow: inset 3px 0 0 var(--red); }
.ic-top { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; align-items: start; }
.ic-idx { width: 26px; height: 26px; border-radius: 999px; background: var(--slate-soft); color: var(--muted); font-weight: 700; font-size: 12.5px; display: grid; place-items: center; }
.ic-req { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.ic-req b { color: var(--fg); font-size: 15px; }
.ic-lots { background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
.ic-lots .hd { font-size: 11.5px; color: var(--faint); display: flex; justify-content: space-between; gap: 8px; }
.grpc { font-size: 12.5px; font-weight: 600; color: var(--indigo); padding: 6px 2px 0; }

/* แถบปุ่มล่างจอ */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); box-shadow: var(--shadow); padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 1280px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; }
.bar-msg { font-size: 13px; color: var(--muted); display: grid; gap: 1px; min-width: 0; }
.bar-msg b { color: var(--fg); font-size: 14px; }
.bar-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.bar-btns .btn { padding: 10px 18px; }
.rejf { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1 1 320px; }
.rejf input { flex: 1 1 200px; min-width: 0; border: 1px solid var(--red-line); background: var(--surface); border-radius: 10px; padding: 8px 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); border-radius: 10px; padding: 8px 14px; font-size: 13px; max-width: calc(100% - 32px); }

@media (max-width: 900px) {
  .qhead { display: none; }
  .qrow { grid-template-columns: 6px minmax(0, 1fr) minmax(0, 1fr) 16px; grid-template-areas: "s n n c" "s a b c" "s d d c"; row-gap: 8px; }
  .qrow .stripe { grid-area: s; } .qrow .nm { grid-area: n; } .qrow .c1 { grid-area: a; } .qrow .c2 { grid-area: b; } .qrow .c3 { grid-area: d; } .qrow .chev { grid-area: c; align-self: center; }
  .lbl { display: block; }
  .cell .a { white-space: normal; }
}
@media (max-width: 767px) {
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .steps { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(96px, 1fr); overflow-x: auto; padding-bottom: 2px; }
  .bar-in { display: grid; justify-content: stretch; }
  .bar-btns { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; justify-content: stretch; }
  .bar-btns .btn { padding: 11px 10px; white-space: normal; }
  .rejf { display: grid; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  <div class="note"><span><b>mockup</b> ให้เคาะก่อนลงโค้ด</span><span>ใบ <b>REQ-20261113-2101</b> ห้องยา G 40 รายการ = ใบจริงในระบบ · lot/คงเหลือจาก inventory ณ 14/11/2569</span><span>ใบอื่นในคิว = ตัวอย่าง (หน่วยงาน/จำนวนรายการจากชีทเบิก 9–13/11 · สถานะสมมุติ)</span><span>จอ ≥768px เป็นตาราง · แคบกว่าเป็นการ์ด</span></div>

// สูตรเดียวกับแอป: unitParser.parseUnit · lotAllocation.sortLotsForDispense / allocateFefo · mergeSameLotEntries · lotNotExpired
const UNITS = 'เม็ด|แคปซูล|cap|tab|ml|mg|g|iu|unit|วาย|ซอง|ขวด|หลอด|แผ่น|อัน|ชิ้น|pack|pcs';
const ALIAS = { bott: 'ขวด', gm: 'กรัม', neb: 'หลอด', capsules: 'แคปซูล', '50vial': 'vial', vial: 'vial' };
function parseUnit(raw) {
  if (!raw || raw === '-') return { packSize: null, baseUnit: raw || '-' };
  const s = String(raw).trim();
  let m = s.match(/(\d+)\s*แผง\s*[×x]\s*(\d+)\s*(เม็ด|แคปซูล|cap|tab)/i); if (m) return { packSize: +m[1] * +m[2], baseUnit: m[3] };
  m = s.match(new RegExp(`\\((\\d[\\d,]*)\\s*(${UNITS})\\)`, 'i')); if (m) return { packSize: parseInt(m[1].replace(/,/g, ''), 10), baseUnit: m[2] };
  m = s.match(new RegExp(`^([\\d,]+)\\s*(${UNITS})$`, 'i')); if (m) return { packSize: parseInt(m[1].replace(/,/g, ''), 10), baseUnit: m[2] };
  return { packSize: null, baseUnit: ALIAS[s.toLowerCase()] || s };
}
const isSupported = (l) => ['สนับสนุน', 'สนับสนุน2'].includes(String(l.itemType || '').trim());
function sortLots(lots) {
  const tier = (l, d) => isSupported(l) ? 1 : (d && d <= LIM6 ? 0 : 2);
  return lots.map(l => ({ l, d: parseExp(l.exp) })).sort((a, b) => {
    const ta = tier(a.l, a.d), tb = tier(b.l, b.d); if (ta !== tb) return ta - tb;
    if (!a.d && !b.d) return 0; if (!a.d) return 1; if (!b.d) return -1; return a.d - b.d;
  }).map(x => x.l);
}
function allocate(reqBase, lots) {
  const want = Math.max(0, Math.floor(n(reqBase))); let rem = want; const allocation = [];
  for (const l of lots) {
    if (rem <= 0) break;
    const avail = Math.floor(l.base / l.packSize); if (avail <= 0) continue;
    const use = Math.min(avail, Math.ceil(rem / l.packSize)); const base = use * l.packSize;
    allocation.push({ ...l, packs: use, base }); rem -= base;
  }
  const got = allocation.reduce((s, a) => s + a.base, 0);
  return { allocation, got, short: Math.max(0, want - got), over: Math.max(0, got - want), ok: got >= want };
}
const splitLoc = (s) => String(s || '').split(',').map(x => x.trim()).filter(x => x && x !== '-');

const lotsBy = {};
for (const r of D.lots) {
  const ps = parseUnit(r.unit).packSize || 1, packs = n(r.qty);
  (lotsBy[r.code] ||= []).push({ lot: r.lot, exp: r.exp, unit: r.unit, loc: splitLoc(r.location), itemType: r.item_type || '', packSize: ps, packs, base: packs * ps });
}
for (const c of Object.keys(lotsBy)) {
  const map = new Map();
  for (const l of lotsBy[c]) {
    const k = `${String(l.lot).trim()}|${String(l.exp).trim()}`; const p = map.get(k);
    if (p) { p.packs += l.packs; p.base += l.base; if (isSupported(l)) p.itemType = l.itemType; l.loc.forEach(x => { if (!p.loc.includes(x)) p.loc.push(x); }); }
    else map.set(k, { ...l, loc: [...l.loc] });
  }
  lotsBy[c] = sortLots([...map.values()].filter(l => { const d = parseExp(l.exp); return !d || d >= TODAY; }));
}

const ITEMS = D.req.items.map((it, i) => {

  return { i, code: it.drug_code, name: it.drug_name, type: it.drug_type, unit: it.drug_unit, req: n(it.requested_qty), a, onhand, locs, perLotLoc, near,

  if (st === 'sheet') {
    if (!it.a.allocation.length) return '<span class="pill p-red">ไม่มีของ</span>';
    if (it.short) return `<span class="pill p-red">จ่ายได้ไม่ครบ</span><span class="sub num">ได้ ${fmt(it.a.got)} จาก ${fmt(it.req)} ${u}</span>`;
    return `<span class="okt">${ic('check')} พอจ่าย</span><span class="sub">ประมาณการ</span>`;
  }
  if (st === 'pick' || st === 'self') {
    const seg = `<div class="rseg" role="group" aria-label="ผลการจัด ${esc(it.name)}"><button type="button" class="full" data-i="${it.i}" data-v="full" aria-pressed="${p.st === 'full'}">${ic('check')} ครบ</button><button type="button" class="part" data-i="${it.i}" data-v="part" aria-pressed="${p.st === 'part'}">ไม่ครบ/ไม่ตรง</button></div>`;
    if (p.st !== 'part') return seg;
    return seg + `<div class="partf"><label for="pq-${it.i}">จัดได้ <input id="pq-${it.i}" class="num" type="number" min="0" inputmode="numeric" data-i="${it.i}" value="${esc(p.qty)}"> ${u}</label>
      <label for="pw-${it.i}">เหตุ <select id="pw-${it.i}" data-i="${it.i}">${['ของไม่พอ', 'lot ไม่ตรงชีท', 'ของชำรุด/แตก', 'อื่นๆ'].map(o => `<option${o === p.why ? ' selected' : ''}>${o}</option>`).join('')}</select></label></div>`;
  }
  if (st === 'check') {
    if (p.st !== 'part') return `<span class="okt">${ic('check')} จัดครบ</span>`;
    return `<span class="pill p-red">จัดไม่ครบ/ไม่ตรง</span><span class="sub num">ได้ ${fmt(p.qty || 0)} จาก ${fmt(it.req)} ${u} · ${esc(p.why)}</span>`;
  }
  return `<span class="okt num">${ic('check')} จ่าย ${fmt(p.st === 'part' ? p.qty || 0 : it.a.got)} ${u}</span>`;
}
const rowCls = (it) => (picking() && state.stage !== 'done' && isPart(it)) || (state.stage === 'sheet' && it.short) ? 'bad' : '';

function renderItems() {
  const chips = FILTERS();
  if (!chips.some(c => c[0] === state.iFilter)) state.iFilter = 'all';
  document.getElementById('iChips').innerHTML = chips.map(([k, l, c, cls]) => `<button type="button" class="fchip ${cls}" data-f="${k}" aria-pressed="${state.iFilter === k}">${l} <b class="num">${c}</b></button>`).join('');
  document.querySelectorAll('#iChips .fchip').forEach(b => b.addEventListener('click', () => { state.iFilter = b.dataset.f; renderItems(); }));
  document.getElementById('sortDoc').setAttribute('aria-pressed', state.sort === 'doc');
  document.getElementById('sortLoc').setAttribute('aria-pressed', state.sort === 'loc');

  let rows = ITEMS.filter(it => state.iFilter === 'all' || (state.iFilter === 'part' ? isPart(it) : it[state.iFilter]));
  if (state.iq) rows = rows.filter(it => it.hay.includes(state.iq));
  if (state.sort === 'loc') rows = [...rows].sort((a, b) => locKey(a).localeCompare(locKey(b)) || a.i - b.i);
  document.getElementById('iCount').textContent = `แสดง ${rows.length} จาก ${ITEMS.length} รายการ`;
  const groups = []; let last;
  for (const it of rows) { const z = state.sort === 'loc' ? zoneOf(it.locs[0]) : null; if (!groups.length || z !== last) { groups.push({ z, rows: [] }); last = z; } groups[groups.length - 1].rows.push(it); }
  const lotHead = state.stage === 'sheet' || state.stage === 'self' ? 'จ่ายจาก lot <small>(ประมาณการ FEFO)</small>' : 'จ่ายจาก lot <small>(ตามชีท บย.)</small>';
  const el = document.getElementById('items');
  if (!rows.length) { el.innerHTML = '<div class="tbl"><div class="empty">ไม่พบรายการ</div></div>'; return; }

  if (wide.matches) {
    const body = groups.map(g => (g.z ? `<tr class="grp"><td colspan="6">${esc(g.z)} · ${g.rows.length} รายการ</td></tr>` : '') + g.rows.map(it => `
      <tr class="${rowCls(it)}">
        <td class="idx num">${it.i + 1}</td>
        <td><div class="dn">${esc(it.name)}</div><div class="dm"><span class="mono">${esc(it.code)}</span><span class="pill p-slate">${esc(it.type)}</span></div></td>
        <td class="r num"><div class="rq">${fmt(it.req)}<small>${esc(it.unit)} · มี ${fmt(it.onhand)}</small></div></td>
        <td><div class="locs">${it.locs.map(x => `<span class="locp">${esc(x)}</span>`).join('') || '<span class="sub">-</span>'}</div></td>
        <td>${lotLines(it)}</td>
        <td>${resultHtml(it)}</td>
      </tr>`).join('')).join('');
    el.innerHTML = `<div class="tbl"><table class="it"><colgroup><col class="c-idx"><col class="c-drug"><col class="c-req"><col class="c-loc"><col><col class="c-res"></colgroup>
      <thead><tr><th class="r">#</th><th>รายการยา</th><th class="r">ขอเบิก</th><th>ที่เก็บ</th><th>${lotHead}</th><th>${state.stage === 'sheet' ? 'ประเมิน' : 'ผลการจัด'}</th></tr></thead><tbody>${body}</tbody></table></div>`;
  } else {
    el.innerHTML = `<div class="cards">${groups.map(g => (g.z ? `<div class="grpc">${esc(g.z)} · ${g.rows.length} รายการ</div>` : '') + g.rows.map(it => `
      <article class="icard ${rowCls(it)}">
        <div class="ic-top"><span class="ic-idx num">${it.i + 1}</span><div><div class="dn">${esc(it.name)}</div><div class="dm"><span class="mono">${esc(it.code)}</span><span class="pill p-slate">${esc(it.type)}</span></div></div></div>
        <div class="ic-req num"><span>ขอ <b>${fmt(it.req)}</b> ${esc(it.unit)}</span><span>คงเหลือ ${fmt(it.onhand)}</span></div>
        <div class="ic-lots"><div class="hd"><span>${state.stage === 'sheet' || state.stage === 'self' ? 'จ่ายจาก lot (ประมาณการ FEFO)' : 'จ่ายจาก lot (ตามชีท)'}</span><span>${it.perLotLoc ? '' : it.locs.map(x => `<span class="locp">${esc(x)}</span>`).join(' ')}</span></div>${lotLines(it)}</div>
        <div>${resultHtml(it)}</div>
      </article>`).join('')).join('')}</div>`;
  }
  el.querySelectorAll('.rseg button').forEach(b => b.addEventListener('click', () => {
    const p = state.pick[+b.dataset.i]; p.st = b.dataset.v;
    if (p.st === 'part' && p.qty === '') p.qty = ITEMS[+b.dataset.i].a.got;
    renderItems(); renderBar();
  }));
  el.querySelectorAll('.partf input').forEach(x => x.addEventListener('input', () => { state.pick[+x.dataset.i].qty = x.value; }));
  el.querySelectorAll('.partf select').forEach(x => x.addEventListener('change', () => { state.pick[+x.dataset.i].why = x.value; }));
}

function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { el.hidden = true; }, 2600); }
function setStage(s) { state.stage = s; state.rejecting = false; renderSlip(); }

function renderBar() {
  const bar = document.getElementById('bar'), inn = document.getElementById('barIn');
  bar.hidden = location.hash !== '#slip';
  if (bar.hidden) return;
  const part = ITEMS.filter(isPart).length, st = state.stage;
  let msg = '', btns = '';
  if (st === 'sheet' && state.rejecting) {
    inn.innerHTML = `<div class="rejf"><label for="rejWhy" class="bar-msg"><b>ไม่อนุมัติทั้งใบ</b>แจ้งเหตุให้ผู้เบิก</label><input id="rejWhy" type="text" placeholder="เช่น ส่งซ้ำกับใบเมื่อวาน"></div>
      <div class="bar-btns"><button class="btn" type="button" id="bCancel">ยกเลิก</button><button class="btn danger" type="button" id="bRejOk">${ic('x')} ยืนยันไม่อนุมัติ</button></div>`;
    document.getElementById('bCancel').onclick = () => { state.rejecting = false; renderBar(); };
    document.getElementById('bRejOk').onclick = () => { state.rejecting = false; renderBar(); toast('mockup: ไม่ได้บันทึกจริง — ใบจะไปอยู่ในประวัติ สถานะไม่อนุมัติ'); };
    return;
  }
  if (st === 'sheet') {
    msg = `<b>รอลงชีทเบิก</b><span>ลงชีทแล้วใบจะขึ้น "ลงชีทแล้ว บย." และย้ายไปรอจัดเอง</span>`;
    btns = `<button class="btn danger" type="button" id="bRej">${ic('x')} ไม่อนุมัติทั้งใบ</button><button class="btn" type="button" id="bSelf">${ic('pkg')} จัดจ่ายเอง (ก่อนลงชีท)</button>`;
  } else if (st === 'pick' || st === 'self') {
    msg = `<b class="num">ครบ ${ITEMS.length - part} · ไม่ครบ/ไม่ตรง ${part}</b><span>จาก ${ITEMS.length} รายการ</span>`;
    btns = `<button class="btn primary" type="button" id="bNext">${ic('check')} จัดเสร็จ</button>`;
  } else if (st === 'check') {
    msg = part ? `<b class="num">จัดไม่ครบ/ไม่ตรง ${part} รายการ</b><span>ตรวจแถวที่ไฮไลต์ก่อนจ่ายออก</span>` : `<b>จัดครบทุกรายการ</b><span>${ITEMS.length} รายการ</span>`;
    btns = `<button class="btn primary" type="button" id="bNext">${ic('check')} ตรวจแล้ว จ่ายออก</button>`;
  } else {
    msg = `<b>จ่ายออกแล้ว</b><span>รอผู้เบิกกดรับของ</span>`;
    btns = `<button class="btn" type="button">${ic('printer')} พิมพ์ใบเบิก</button>`;
  }
  inn.innerHTML = `<div class="bar-msg">${msg}</div><div class="bar-btns">${btns}</div>`;
  const r = document.getElementById('bRej'); if (r) r.onclick = () => { state.rejecting = true; renderBar(); document.getElementById('rejWhy').focus(); };
  const s = document.getElementById('bSelf'); if (s) s.onclick = () => { setStage('self'); toast('mockup: เปลี่ยนเป็นจัดจ่ายเองก่อนลงชีท'); };
  const nx = document.getElementById('bNext'); if (nx) nx.onclick = () => { setStage(st === 'check' ? 'done' : 'check'); toast('mockup: ไม่ได้บันทึกจริง'); window.scrollTo({ top: 0 }); };
}

function renderSlip() { renderSlipHead(); renderItems(); renderBar(); }
function route() {
  const slip = location.hash === '#slip';
  document.getElementById('vQueue').hidden = slip;
  document.getElementById('vSlip').hidden = !slip;
  if (slip) renderSlip(); else { renderQueue(); renderBar(); }
}

document.getElementById('qSearch').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); renderQueue(); });
document.getElementById('qType').addEventListener('change', e => { state.qType = e.target.value; renderQueue(); });
document.getElementById('backBtn').addEventListener('click', () => { location.hash = 'queue'; });
document.querySelectorAll('#stageSeg button').forEach(b => b.addEventListener('click', () => setStage(b.dataset.s)));
document.getElementById('iSearch').addEventListener('input', e => { state.iq = e.target.value.trim().toLowerCase(); renderItems(); });
const setSort = (s) => { state.sort = s; try { localStorage.setItem('reqmock_sort', s); } catch {} renderItems(); };
document.getElementById('sortDoc').addEventListener('click', () => setSort('doc'));
document.getElementById('sortLoc').addEventListener('click', () => setSort('loc'));
wide.addEventListener('change', () => { if (location.hash === '#slip') renderItems(); });
window.addEventListener('hashchange', () => { route(); window.scrollTo({ top: 0 }); });
route();
</script>
